services:
  api:
    build:
      context: docker
      dockerfile: api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./packages/backend:/app
    # Points mail at the mailpit service regardless of what the local .env says.
    # These names are added to ServeCommand::$passthroughVariables in
    # AppServiceProvider; without that, `artisan serve` strips them and the
    # request process silently falls back to .env.
    environment:
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mailpit

  # Catches every email the API sends (OTP codes). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: docker
      dockerfile: web.Dockerfile
    command: sh -c "flutter pub get && flutter run -d web-server --web-hostname 0.0.0.0 --web-port 5000"
    ports:
      # Host 5050: macOS AirPlay Receiver (ControlCenter) occupies host 5000.
      - "5050:5000"
    # Keep the Flutter run REPL alive so hot reload works via:
    #   docker compose attach web   (then press "r")
    stdin_open: true
    tty: true
    volumes:
      - ./platform/frontend:/app
      # Anonymous volumes: keep Linux build artifacts out of the macOS checkout.
      - /app/.dart_tool
      - /app/build
      - pub-cache:/root/.pub-cache

volumes:
  pub-cache:
